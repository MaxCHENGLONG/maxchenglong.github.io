{%- comment -%}
Image with an optional caption, for blog articles.
Usage: {% include figure.html src="/assets/images/blog/my-post/fig1.png" caption="Some caption" width="80%" %}
{%- endcomment -%}
<figure class="post-figure">
<img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption | strip_html }}" loading="lazy"{% if include.width %} style="max-width: {{ include.width }};"{% endif %}>
{% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
