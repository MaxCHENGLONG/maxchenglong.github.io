---
layout: default
---

{% for script in page.scripts %}
<script src="{{ script }}"></script>
{% endfor %}

<article class="post card border-0 shadow-sm bg-white mx-auto mb-4">
    <div class="card-body p-4 p-md-5">
        <header class="mb-4">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="text-muted small">{{ page.date | date: "%B %-d, %Y" }}</div>
            {% if page.description %}<p class="lead mt-3 mb-0">{{ page.description }}</p>{% endif %}
        </header>
        <div class="post-content">
            {{ content }}
        </div>
        <hr class="mt-5">
        <a href="{{ '/blog' | relative_url }}"><i class="fas fa-angle-double-left"></i> Back to Blog</a>
    </div>
</article>
