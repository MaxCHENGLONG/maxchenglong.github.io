<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Softmax Temperature</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  body { margin: 0; padding: 12px; font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #212529; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 15px; }
  .controls input[type=range] { flex: 1; min-width: 160px; }
  #plot { height: 360px; }
</style>
</head>
<body>
<div class="controls">
  <label for="temperature">Temperature <strong id="temperature-value"></strong></label>
  <input id="temperature" type="range" min="0.1" max="5" step="0.1" value="1">
</div>
<div id="plot"></div>
<script>
(function () {
  var tokens = ["The", "cat", "sat", "on", "the", "mat"];
  var scores = [1.2, 3.1, 2.0, -0.5, 0.8, 2.6];
  var slider = document.getElementById("temperature");
  var label = document.getElementById("temperature-value");

  function softmax(xs, T) {
    var e = xs.map(function (x) { return Math.exp(x / T); });
    var sum = e.reduce(function (a, b) { return a + b; }, 0);
    return e.map(function (v) { return v / sum; });
  }

  function draw() {
    var T = parseFloat(slider.value);
    label.textContent = T.toFixed(1);
    Plotly.react("plot", [{
      x: tokens,
      y: softmax(scores, T),
      type: "bar",
      marker: { color: "#3b6fb6" }
    }], {
      margin: { t: 20, r: 10, b: 40, l: 50 },
      yaxis: { range: [0, 1], title: { text: "attention weight" } }
    }, { responsive: true, displayModeBar: false });
  }

  slider.addEventListener("input", draw);
  draw();
})();
</script>
</body>
</html>
